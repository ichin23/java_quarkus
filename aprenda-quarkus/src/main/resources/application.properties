


quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url= jdbc:postgresql://localhost:5432/postgres
quarkus.datasource.jdbc.max-size=16

%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import-dev.sql

%prod.quarkus.hibernate-orm.schema-management.strategy=none
%prod.quarkus.hibernate-orm.sql-load-script=no-file


quarkus.http.host=0.0.0.0
quarkus.application.name=aprenda-quarkus

quarkus.otel.simple=true
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true

quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317

quarkus.otel.exporter.otlp.headers=authorization=Bearer my_secret 
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n  

# Alternative to the console log
quarkus.http.access-log.pattern="...traceId=%{X,traceId} spanId=%{X,spanId}"

# Caminho do endpoint de métricas (padrão já é /q/metrics)
quarkus.micrometer.export.prometheus.path=/q/metrics

# Adiciona uma tag global em todas as métricas (útil quando há vários microsserviços)
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.export.prometheus.default-registry=true

org.ichin23.jaeger.UnidadeFederativaService/mp-rest/url=http://localhost:8180
#org.ichin23.jaeger.UnidadeFederativaService/mp-rest/scope=javax.inject.Singleton

quarkus.oidc.auth-server-url=http://localhost:8100/realms/quarkus
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret
quarkus.keycloak.policy-enforcer.enabled=false




